[project]
name = "kaori"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.135.3",
    "langchain>=1.2.18",
    "langchain-classic>=1.0.7",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.1.12",
    "mcp>=1.26.0",
    "neo4j>=6.1.0",
    "neomodel>=6.1.0",
    "numpy>=2.4.2",
    "openai>=2.26.0",
    "pip>=26.0.1",
    "pprintpp>=0.4.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scipy>=1.17.1",
    "sentence-transformers>=5.3.0",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.41.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
